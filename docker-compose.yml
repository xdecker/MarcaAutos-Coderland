services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Xdecker123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/MarcaAutos.API
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=autos;Username=postgres;Password=Xdecker123"
      SeedData__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
